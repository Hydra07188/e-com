	<link href="css/style.css" rel="stylesheet">
	<title>Furni - Register</title>
</head>

<body>
	<nav class="custom-navbar navbar navbar-expand-md navbar-dark bg-dark" arial-label="Furni navigation bar">
		<div class="container">
			<a class="navbar-brand" href="index.html">Furni<span>.</span></a>

			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarsFurni"
				aria-controls="navbarsFurni" aria-expanded="false" aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>

			<div class="collapse navbar-collapse" id="navbarsFurni">
				<ul class="custom-navbar-nav navbar-nav ms-auto mb-2 mb-md-0">
					<li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
					<li><a class="nav-link" href="shop.html">Shop</a></li>
					<li><a class="nav-link" href="about.html">About us</a></li>
					<li><a class="nav-link" href="services.html">Services</a></li>
					<li><a class="nav-link" href="blog.html">Blog</a></li>
					<li><a class="nav-link" href="contact.html">Contact us</a></li>
				</ul>

				<ul class="custom-navbar-cta navbar-nav mb-2 mb-md-0 ms-5">
					<li class="active"><a class="nav-link" href="login.html"><img src="images/user.svg" alt="Account"></a></li>
					<li><a class="nav-link" href="cart.html"><img src="images/cart.svg" alt="Cart"></a></li>
				</ul>
			</div>
		</div>
	</nav>

	<div class="hero">
		<div class="container">
			<div class="row justify-content-between">
				<div class="col-lg-5">
					<div class="intro-excerpt">
						<h1>Register</h1>
						<p class="mb-4">Create an account with a strong password before you continue shopping.</p>
					</div>
				</div>
				<div class="col-lg-7"></div>
			</div>
		</div>
	</div>

	<div class="untree_co-section">
		<div class="container">
			<div class="block">
				<div class="row justify-content-center">
					<div class="col-md-6 col-lg-5 pb-4">
						<div id="register-alert" class="alert alert-danger" style="display: none;" role="alert"></div>

						<form id="register-form" class="bg-white p-5 rounded shadow-sm">
							<h2 class="h4 text-black mb-4">Create account</h2>
							<div class="form-group mb-3">
								<label class="text-black" for="firstName">Name</label>
								<input type="text" class="form-control" id="firstName" autocomplete="given-name" required>
							</div>

							<div class="form-group mb-3">
								<label class="text-black" for="email">Email address</label>
								<input type="email" class="form-control" id="email" placeholder="name@example.com" autocomplete="email" required>
							</div>

							<div class="form-group mb-4">
								<label class="text-black" for="password">Password</label>
								<input type="password" class="form-control" id="password" autocomplete="new-password" required>
								<small class="form-text text-muted">At least 8 characters, 1 uppercase letter, and 1 symbol such as _, !, @, or #.</small>
							</div>

							<button type="submit" class="btn btn-black btn-lg w-100">Register</button>
							<p class="text-center mt-4 mb-0">Already have an account? <a href="login.html">Sign in</a></p>
						</form>
					</div>
				</div>
			</div>
		</div>
	</div>

	<script src="js/bootstrap.bundle.min.js"></script>
	<script src="js/custom.js"></script>
	<script src="js/register.js?v=2"></script>
</body>

</html>
